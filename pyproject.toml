[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "comfyui-orbitquant"
version = "0.6.0"
description = "ComfyUI custom nodes for OrbitQuant artifacts"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "WaveCut" }]
dependencies = [
  "orbitquant>=0.12.0,<1",
]

[project.optional-dependencies]
kernels = [
  "orbitquant[hf,kernels]>=0.12.0,<1",
]
dev = [
  "pytest>=8.4",
  "ruff>=0.12",
]

[project.urls]
Repository = "https://github.com/iamwavecut/ComfyUI-OrbitQuant"
Documentation = "https://github.com/iamwavecut/ComfyUI-OrbitQuant#readme"
Issues = "https://github.com/iamwavecut/ComfyUI-OrbitQuant/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/comfyui_orbitquant"]

[tool.hatch.build.targets.sdist]
exclude = ["/evidence/**"]
include = [
  "src", "tests", "example_workflows", "__init__.py", "install.py",
  "requirements.txt", "README.md", "LICENSE",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
